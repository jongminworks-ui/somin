<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notebook / Draft editor</title><style>body{max-width:760px;margin:50px auto;padding:24px;background:#f5f2eb;color:#222;font:16px/1.8 sans-serif}label{display:block;margin:20px 0}input,textarea{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;background:#fff;font:inherit}button{padding:12px 20px;margin:5px;border:1px solid #222;background:transparent;cursor:pointer}textarea{height:220px}article{border-top:1px solid;padding:20px 0;white-space:pre-wrap}small{color:#555}</style><a href="./">← Portfolio</a><h1>Notebook / Draft editor</h1><p>パソコンで整えてから、記録を残す。</p><small>下書きはこのブラウザに保存されます。「書き出す」で notebook.json を保存し、サイトの同名ファイルを置き換えて再公開してください。この画面からの自動公開は未実装です。</small><label>日付<input id="date" type="date" required></label><label>タイトル<input id="title" required></label><label>関連する作品・テーマ<input id="project"></label><label>本文<textarea id="text"></textarea></label><button id="add">下書きに追加</button><button id="download">notebook.json を書き出す</button><label>既存ファイルを読み込む<input type="file" id="import" accept="application/json"></label><p id="message" role="status"></p><div id="posts"></div><script>let posts=JSON.parse(localStorage.getItem('jong-notebook')||'[]');const el=id=>document.getElementById(id);el('date').value=new Date().toISOString().slice(0,10);function render(){el('posts').replaceChildren();posts.forEach((p,i)=>{const a=document.createElement('article');a.textContent=p.date+' / '+p.title+'\n'+p.text;const b=document.createElement('button');b.textContent='削除';b.onclick=()=>{posts.splice(i,1);save()};a.append(b);el('posts').append(a)})}function save(){localStorage.setItem('jong-notebook',JSON.stringify(posts));render()}el('add').onclick=()=>{if(!el('title').value.trim()||!el('date').value){el('message').textContent='日付とタイトルを入力してください。';return}posts.unshift({date:el('date').value,title:el('title').value,project:el('project').value,text:el('text').value});save();el('message').textContent='このブラウザに下書きを保存しました。'};el('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(posts,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='notebook.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};el('import').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||data.some(p=>typeof p.title!=='string'||typeof p.text!=='string'))throw Error();posts=data;save();el('message').textContent='読み込みました。'}catch{el('message').textContent='Notebook形式のJSONを選択してください。'}};render();</script></html>
